    <!-- الالتقاط الفوري المسبق لحدث التثبيت وتسجيل Service Worker -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('app_install_prompt_ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredPrompt = null;
        try {
          localStorage.setItem('app_installed_success', 'true');
        } catch (e) {}
        window.dispatchEvent(new CustomEvent('app_install_completed'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
